name: CI

# Se ejecuta en cada pull request y en cada push a main. Ninguna fusión debería
# entrar sin pasar por aquí.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · pruebas y linters
    runs-on: ubuntu-latest

    services:
      postgres:
        # Misma imagen que en desarrollo: pgvector viene incluido. Usar
        # `postgres` a secas haría fallar las migraciones en CI por una
        # extensión ausente, que es una forma tonta de perder una hora.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: narrateca
          POSTGRES_PASSWORD: narrateca
          POSTGRES_DB: narrateca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U narrateca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://narrateca:narrateca@localhost:5432/narrateca
      SECRET_KEY: clave-de-integracion-continua-larga
      # El modelo real no se descarga en CI: 470 MB en cada ejecución no aportan
      # nada, porque lo que se prueba es la mecánica del índice y no la calidad
      # de la recuperación.
      EMBEDDINGS_PROVIDER: deterministic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linter y formato
        working-directory: backend
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Pruebas
        working-directory: backend
        run: pytest -q

      # -- Migraciones reversibles ---------------------------------------------
      # Atrapa la migración que funciona en el equipo de quien la escribió y
      # falla al desplegar, y la que no puede revertirse cuando hace falta.
      - name: Migraciones aplicables y reversibles
        working-directory: backend
        run: |
          set -euo pipefail
          echo "→ aplicando todas las migraciones sobre una base limpia"
          alembic upgrade head

          echo "→ revirtiendo hasta la base"
          alembic downgrade base

          echo "→ volviendo a aplicar"
          alembic upgrade head

          echo "→ verificando que no queden cambios sin migrar"
          # Si el modelo cambió sin generar migración, autogenerate produciría
          # operaciones. Un archivo con solo `pass` significa que está al día.
          alembic revision --autogenerate -m "verificacion" --rev-id verificacion
          if grep -qE "^\s+op\.(create|drop|add|alter)" alembic/versions/verificacion_*.py; then
            echo "✗ Hay cambios de modelo sin migración. Genera una con:"
            echo "   alembic revision --autogenerate -m '<descripción>'"
            cat alembic/versions/verificacion_*.py
            exit 1
          fi
          rm -f alembic/versions/verificacion_*.py
          echo "✓ migraciones al día"

      # -- Auditoría de consentimiento -----------------------------------------
      # Convierte la garantía central del proyecto en algo que el CI hace
      # cumplir: ningún fragmento del índice puede provenir de una pieza que no
      # autorizó su uso con IA.
      - name: Auditoría de consentimiento del índice
        working-directory: backend
        run: python -m app.cli auditar-consentimiento --estricto

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · pruebas, contraste y accesibilidad
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Linter de JavaScript
        working-directory: frontend
        run: npm run lint

      # Impide que alguien escriba un color literal en un componente, que es lo
      # que rompería la paleta intercambiable.
      - name: Linter de CSS
        working-directory: frontend
        run: npm run lint:css

      # Impide que alguien rompa el contraste sin enterarse. Ya atrapó un
      # defecto real: un borde de control a 1.76:1.
      - name: Contraste WCAG 2.2 AA
        working-directory: frontend
        run: npm run check:contrast

      # El frontend es capa de renderizado; los endpoints viven en el backend,
      # donde están la autorización por tema y las reglas de consentimiento.
      - name: Sin API routes en el frontend
        working-directory: frontend
        run: npm run check:no-api-routes

      - name: Pruebas
        working-directory: frontend
        run: npm test

  # ---------------------------------------------------------------------------
  # Comprueba que `.gitignore` no esté descartando código fuente, y que las
  # reglas que protegen el material del archivo sigan en pie.
  #
  # No es una precaución teórica: las reglas `archive/` y `media/`, escritas sin
  # barra inicial para proteger el material a cualquier profundidad, dejaron
  # `app/modules/archive/` y `app/modules/media/` fuera del repositorio. En
  # local no se notaba —los archivos estaban en el disco— y ruff tampoco decía
  # nada, porque respeta `.gitignore` y saltaba esos módulos en silencio.
  integridad:
    name: Repositorio · integridad
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ningún archivo de código ignorado
        run: ./scripts/verificar-integridad-repo.sh

  # ---------------------------------------------------------------------------
  infra:
    name: Infraestructura · formato y validación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Formato canónico
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Validar ambientes
        working-directory: infra
        run: |
          set -euo pipefail
          for entorno in envs/staging envs/prod; do
            echo "→ $entorno"
            terraform -chdir="$entorno" init -backend=false -input=false > /dev/null
            terraform -chdir="$entorno" validate
          done

  # ---------------------------------------------------------------------------
  imagenes:
    name: Imágenes de contenedor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Se construyen sin publicar: verifica que el Dockerfile sigue siendo
      # válido y que las dependencias declaradas bastan para una instalación
      # limpia. Ya atrapó cuatro dependencias del RAG sin declarar en el
      # manifiesto, que funcionaban solo porque estaban en un entorno local.
      - name: Construir backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
