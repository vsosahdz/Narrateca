name: Desplegar a producción

# Solo una etiqueta de versión despliega a producción. Un push a `main` no
# basta: eso es lo que separa «lo que el equipo está construyendo» de «lo que
# el público está viendo», y deja un registro explícito de qué versión está en
# línea y desde cuándo.
on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGION: us-central1
  ENTORNO: prod

permissions:
  contents: read
  id-token: write

jobs:
  # Producción aloja el material del archivo. Se vuelve a verificar todo antes
  # de desplegar, aunque ya haya pasado por CI: la etiqueta puede apuntar a un
  # commit distinto del que se probó.
  verificar:
    name: Verificación previa
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: narrateca
          POSTGRES_PASSWORD: narrateca
          POSTGRES_DB: narrateca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U narrateca"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://narrateca:narrateca@localhost:5432/narrateca
      SECRET_KEY: clave-de-verificacion-larga
      EMBEDDINGS_PROVIDER: deterministic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Pruebas del backend
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check app tests
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verificación del frontend
        working-directory: frontend
        run: |
          npm ci
          npm run verify

  desplegar:
    name: Construir y desplegar
    needs: verificar
    runs-on: ubuntu-latest
    # El ambiente `production` de GitHub permite exigir revisores antes de que
    # este trabajo empiece. Se configura en los ajustes del repositorio.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Autenticar con GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurar acceso al registro
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar el backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/api:${{ github.ref_name }}
            ${{ vars.REGISTRY_URL }}/api:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y publicar el frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/web:${{ github.ref_name }}
            ${{ vars.REGISTRY_URL }}/web:prod
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.MEDIA_URL }}
            API_BASE_URL=${{ vars.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Copia de seguridad ANTES de migrar. Si una migración sale mal sobre el
      # archivo, la diferencia entre un susto y una pérdida es esta línea.
      - name: Copia de seguridad previa a la migración
        run: |
          gcloud sql backups create \
            --instance "narrateca-${{ env.ENTORNO }}" \
            --description "Previa a ${{ github.ref_name }}" \
            --quiet

      - name: Aplicar migraciones
        run: |
          gcloud run jobs deploy narrateca-migrar-${{ env.ENTORNO }} \
            --image "${{ vars.REGISTRY_URL }}/api:${{ github.ref_name }}" \
            --region "${{ env.REGION }}" \
            --service-account "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --network "narrateca-${{ env.ENTORNO }}" \
            --subnet "narrateca-${{ env.ENTORNO }}" \
            --vpc-egress private-ranges-only \
            --set-secrets "DATABASE_URL=narrateca-${{ env.ENTORNO }}-database-url:latest" \
            --command alembic --args upgrade,head \
            --max-retries 1 --quiet
          gcloud run jobs execute narrateca-migrar-${{ env.ENTORNO }} \
            --region "${{ env.REGION }}" --wait --quiet

      - name: Desplegar el backend
        run: |
          gcloud run deploy narrateca-api-${{ env.ENTORNO }} \
            --image "${{ vars.REGISTRY_URL }}/api:${{ github.ref_name }}" \
            --region "${{ env.REGION }}" --quiet

      - name: Desplegar el frontend
        run: |
          gcloud run deploy narrateca-web-${{ env.ENTORNO }} \
            --image "${{ vars.REGISTRY_URL }}/web:${{ github.ref_name }}" \
            --region "${{ env.REGION }}" --quiet

      - name: Verificar que responde
        id: verificacion
        run: |
          set -euo pipefail
          for intento in $(seq 1 10); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ vars.API_URL }}/ready" || echo 000)
            [ "$codigo" = "200" ] && break
            echo "  intento $intento: $codigo"
            sleep 10
          done
          [ "$codigo" = "200" ] || { echo "✗ el backend no respondió"; exit 1; }

          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ vars.WEB_URL }}/es")
          [ "$codigo" = "200" ] || { echo "✗ el frontend devolvió $codigo"; exit 1; }

      # La garantía central del proyecto, verificada en producción después de
      # cada despliegue: ningún fragmento del corpus del chatbot proviene de una
      # pieza que no autorizó su uso con IA.
      - name: Auditar el consentimiento del índice
        run: |
          gcloud run jobs deploy narrateca-auditar-${{ env.ENTORNO }} \
            --image "${{ vars.REGISTRY_URL }}/api:${{ github.ref_name }}" \
            --region "${{ env.REGION }}" \
            --service-account "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --network "narrateca-${{ env.ENTORNO }}" \
            --subnet "narrateca-${{ env.ENTORNO }}" \
            --vpc-egress private-ranges-only \
            --set-secrets "DATABASE_URL=narrateca-${{ env.ENTORNO }}-database-url:latest" \
            --command python --args -m,app.cli,auditar-consentimiento \
            --max-retries 0 --quiet
          gcloud run jobs execute narrateca-auditar-${{ env.ENTORNO }} \
            --region "${{ env.REGION }}" --wait --quiet

      # Si algo de lo anterior falló, se devuelve el tráfico a la revisión
      # anterior. Cloud Run conserva las revisiones, así que revertir es
      # redirigir tráfico y no volver a desplegar.
      - name: Revertir si algo falló
        if: failure()
        run: |
          for servicio in api web; do
            anterior=$(gcloud run revisions list \
              --service "narrateca-${servicio}-${{ env.ENTORNO }}" \
              --region "${{ env.REGION }}" \
              --format "value(name)" --sort-by "~metadata.creationTimestamp" \
              --limit 2 | tail -1)
            if [ -n "$anterior" ]; then
              echo "→ devolviendo el tráfico de $servicio a $anterior"
              gcloud run services update-traffic "narrateca-${servicio}-${{ env.ENTORNO }}" \
                --region "${{ env.REGION }}" --to-revisions "${anterior}=100" --quiet
            fi
          done
          echo "::error::Despliegue revertido. Revisar los registros antes de reintentar."

      - name: Resumen
        run: |
          {
            echo "## Producción · ${{ github.ref_name }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Versión | \`${{ github.ref_name }}\` |"
            echo "| Revisión | \`${{ github.sha }}\` |"
            echo "| Sitio | ${{ vars.WEB_URL }}/es |"
            echo ""
            echo "Copia de seguridad creada antes de migrar."
          } >> "$GITHUB_STEP_SUMMARY"
