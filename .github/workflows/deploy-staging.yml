name: Desplegar a staging

# Cada fusión a `main` llega a staging. Producción no: eso exige una etiqueta
# de versión (ver deploy-prod.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez. Sin esto, dos fusiones seguidas pueden dejar en
# staging una revisión más vieja que la última.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGION: us-central1
  ENTORNO: staging

permissions:
  contents: read
  # Necesario para que GitHub emita el token que GCP verifica. Sin llaves.
  id-token: write

jobs:
  desplegar:
    name: Construir y desplegar
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation: GitHub presenta un token firmado por su
      # emisor y GCP devuelve credenciales de vida corta. No hay ninguna llave
      # guardada como secreto que pueda filtrarse.
      - name: Autenticar con GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurar acceso al registro
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Construir y publicar el backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/api:${{ github.sha }}
            ${{ vars.REGISTRY_URL }}/api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir y publicar el frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/web:${{ github.sha }}
            ${{ vars.REGISTRY_URL }}/web:staging
          # La dirección de la API viaja al navegador, así que se incrusta en el
          # build y cada ambiente necesita su propia imagen.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.MEDIA_URL }}
            API_BASE_URL=${{ vars.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Las migraciones corren ANTES de desplegar el código nuevo. Al revés, el
      # código nuevo encontraría un esquema viejo y fallaría en cada petición
      # durante la ventana intermedia.
      - name: Aplicar migraciones
        run: |
          gcloud run jobs deploy narrateca-migrar-${{ env.ENTORNO }} \
            --image "${{ vars.REGISTRY_URL }}/api:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --service-account "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --network "narrateca-${{ env.ENTORNO }}" \
            --subnet "narrateca-${{ env.ENTORNO }}" \
            --vpc-egress private-ranges-only \
            --set-secrets "DATABASE_URL=narrateca-${{ env.ENTORNO }}-database-url:latest" \
            --command alembic --args upgrade,head \
            --max-retries 1 \
            --quiet
          gcloud run jobs execute narrateca-migrar-${{ env.ENTORNO }} \
            --region "${{ env.REGION }}" --wait --quiet

      - name: Desplegar el backend
        run: |
          gcloud run deploy narrateca-api-${{ env.ENTORNO }} \
            --image "${{ vars.REGISTRY_URL }}/api:${{ github.sha }}" \
            --region "${{ env.REGION }}" --quiet

      - name: Desplegar el frontend
        run: |
          gcloud run deploy narrateca-web-${{ env.ENTORNO }} \
            --image "${{ vars.REGISTRY_URL }}/web:${{ github.sha }}" \
            --region "${{ env.REGION }}" --quiet

      # Comprobación posterior. Un despliegue que responde 500 debe fallar aquí
      # y no descubrirse cuando alguien abre el sitio.
      - name: Verificar que responde
        run: |
          set -euo pipefail
          for intento in $(seq 1 10); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ vars.API_URL }}/health" || echo 000)
            [ "$codigo" = "200" ] && { echo "✓ backend responde"; break; }
            echo "  intento $intento: $codigo"
            sleep 10
          done
          [ "$codigo" = "200" ] || { echo "✗ el backend no respondió"; exit 1; }

          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ vars.WEB_URL }}/es")
          [ "$codigo" = "200" ] || { echo "✗ el frontend devolvió $codigo"; exit 1; }
          echo "✓ frontend responde"

      # Staging usa SOLO datos sintéticos: nunca material del archivo. Es una
      # decisión de confidencialidad, no de comodidad.
      - name: Auditar el consentimiento del índice
        run: |
          gcloud run jobs deploy narrateca-auditar-${{ env.ENTORNO }} \
            --image "${{ vars.REGISTRY_URL }}/api:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --service-account "${{ vars.RUNTIME_SERVICE_ACCOUNT }}" \
            --network "narrateca-${{ env.ENTORNO }}" \
            --subnet "narrateca-${{ env.ENTORNO }}" \
            --vpc-egress private-ranges-only \
            --set-secrets "DATABASE_URL=narrateca-${{ env.ENTORNO }}-database-url:latest" \
            --command python --args -m,app.cli,auditar-consentimiento \
            --max-retries 0 --quiet
          gcloud run jobs execute narrateca-auditar-${{ env.ENTORNO }} \
            --region "${{ env.REGION }}" --wait --quiet

      - name: Resumen
        run: |
          {
            echo "## Desplegado a staging"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Revisión | \`${{ github.sha }}\` |"
            echo "| Sitio | ${{ vars.WEB_URL }}/es |"
            echo "| API | ${{ vars.API_URL }}/docs |"
            echo ""
            echo "La base de datos de staging se apaga fuera de horario laboral."
          } >> "$GITHUB_STEP_SUMMARY"
